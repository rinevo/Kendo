<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 200" width="182" height="200">
  <defs>
    <!-- 全体の道場背景(dojo-bg.png)に合わせた温かみのある白い漆喰壁グラデーション -->
    <linearGradient id="plasterWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe4" />
      <stop offset="55%" stop-color="#eadbc6" />
      <stop offset="100%" stop-color="#d7c2a6" />
    </linearGradient>

    <!-- 窓からの柔らかな陽光ハイライト -->
    <radialGradient id="sunGlow" cx="0.2" cy="0.25" r="0.85">
      <stop offset="0%" stop-color="#fffdf9" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#f3eadc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d4bfa3" stop-opacity="0" />
    </radialGradient>

    <!-- 壁下部の木製巾木（腰木・長押と同系色） -->
    <linearGradient id="woodTrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4e29" />
      <stop offset="50%" stop-color="#6b4423" />
      <stop offset="100%" stop-color="#4e2f16" />
    </linearGradient>

    <!-- 道場背景と揃えた艶のある飴色・琥珀色の板張り床 -->
    <linearGradient id="hinokiFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#de984e" />
      <stop offset="45%" stop-color="#c47932" />
      <stop offset="100%" stop-color="#9c581e" />
    </linearGradient>

    <!-- 床面のほのかな陽光反射 -->
    <linearGradient id="floorSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe4b5" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#ffd28a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#c47932" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 上部：白い漆喰壁（装飾なし・道場背景と同系色） -->
  <rect x="0" y="0" width="182" height="170" fill="url(#plasterWall)" />
  <rect x="0" y="0" width="182" height="170" fill="url(#sunGlow)" />

  <!-- 壁上端の控えめな長押（木枠）ライン -->
  <rect x="0" y="0" width="182" height="4" fill="#6b4423" opacity="0.75" />
  <line x1="0" y1="4.5" x2="182" y2="4.5" stroke="#4e2f16" stroke-width="0.8" opacity="0.5" />

  <!-- 壁と床の境界：木製の巾木（ベースボード） -->
  <rect x="0" y="169" width="182" height="6" fill="url(#woodTrim)" />
  <line x1="0" y1="169" x2="182" y2="169" stroke="#8c5a30" stroke-width="0.8" opacity="0.7" />
  <line x1="0" y1="175" x2="182" y2="175" stroke="#3b220e" stroke-width="1" opacity="0.8" />

  <!-- 下部：琥珀色の檜板張り床 -->
  <rect x="0" y="175" width="182" height="25" fill="url(#hinokiFloor)" />
  <rect x="0" y="175" width="182" height="25" fill="url(#floorSheen)" />

  <!-- 板目の水平ライン -->
  <line x1="0" y1="183" x2="182" y2="183" stroke="#7c4314" stroke-width="1" opacity="0.55" />
  <line x1="0" y1="191" x2="182" y2="191" stroke="#7c4314" stroke-width="1" opacity="0.55" />

  <!-- 板の継ぎ目（パースライン） -->
  <g stroke="#7c4314" stroke-width="1" opacity="0.45">
    <line x1="36" y1="175" x2="20" y2="200" />
    <line x1="91" y1="175" x2="91" y2="200" />
    <line x1="146" y1="175" x2="162" y2="200" />
  </g>

  <!-- 試合場の白線（境界線＋開始線） -->
  <line x1="0" y1="177" x2="182" y2="177" stroke="#f8f1e5" stroke-width="2.2" opacity="0.92" />
  <line x1="112" y1="177" x2="118" y2="194" stroke="#f8f1e5" stroke-width="2.4" opacity="0.9" stroke-linecap="round" />
</svg>
